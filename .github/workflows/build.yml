name: Build portable MPP Viewer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build jar
        run: mvn -B package

      - name: Package portable app (Java included)
        shell: bash
        run: |
          jpackage --type app-image \
            --name MPPViewer \
            --input target \
            --main-jar mppviewer.jar \
            --main-class MppViewer \
            --dest dist

      - uses: actions/upload-artifact@v4
        with:
          name: MPPViewer-${{ matrix.os }}
          path: dist
